name: awesome_safe
description: Cofre local criptografado para proteger seus arquivos.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.9.0
  file_picker: ^13.1.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  ios: false
  android: true
  image_path: "assets/icon/app_icon.png"
  windows:
    generate: true
    icon_size: 48
    image_path: "assets/icon/app_icon.png"