name: Flutter Multi-Platform Release

on:
  push:
    tags:
      - 'v*.*.*' # Dispara apenas ao enviar tags como v1.0.0, v2.1.3, etc.

jobs:
  # ------------------------------------------------------
  # 1. Builds para Android, Web e Linux (Ubuntu)
  # ------------------------------------------------------
  build-ubuntu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [apk, web, linux]
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java
        if: matrix.target == 'apk'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar dependências para Linux
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblldb-dev

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Build do Artefato (${{ matrix.target }})
        run: |
          if [ "${{ matrix.target }}" = "apk" ]; then
            flutter build apk --release
          elif [ "${{ matrix.target }}" = "web" ]; then
            flutter build web --release
            cd build/web && zip -r ../../web-build.zip . && cd ../..
          elif [ "${{ matrix.target }}" = "linux" ]; then
            flutter build linux --release
            cd build/linux/x64/release/bundle && zip -r ../../../../../linux-build.zip . && cd ../../../../..
          fi

      - name: Upload do Artefato
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            web-build.zip
            linux-build.zip

  # ------------------------------------------------------
  # 2. Build para Windows (Windows)
  # ------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Build para Windows
        run: flutter build windows --release

      - name: Compactar build do Windows
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath windows-build.zip

      - name: Upload do Artefato
        uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: windows-build.zip

  # ------------------------------------------------------
  # 3. Build para macOS (macOS)
  # ------------------------------------------------------
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Build para macOS
        run: flutter build macos --release

      - name: Compactar build do macOS
        run: cd build/macos/Build/Products/Release && zip -r ../../../../../macos-build.zip . && cd ../../../../..

      - name: Upload do Artefato
        uses: actions/upload-artifact@v4
        with:
          name: build-macos
          path: macos-build.zip

  # ------------------------------------------------------
  # 4. Job de Publicação no GitHub Releases
  # ------------------------------------------------------
  create-release:
    needs: [build-ubuntu, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permissão necessária para criar a Release
    steps:
      - name: Baixar todos os artefatos compilados
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Organizar arquivos para publicação
        run: |
          mkdir release_files
          cp artifacts/build-apk/app-release.apk release_files/app-release.apk || true
          cp artifacts/build-web/web-build.zip release_files/web-build.zip || true
          cp artifacts/build-linux/linux-build.zip release_files/linux-build.zip || true
          cp artifacts/build-windows/windows-build.zip release_files/windows-build.zip || true
          cp artifacts/build-macos/macos-build.zip release_files/macos-build.zip || true

      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_files/*
          generate_release_notes: true # Gera automaticamente o changelog baseado nos commits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
