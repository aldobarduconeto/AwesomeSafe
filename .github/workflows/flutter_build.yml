name: Flutter Multi-Platform Build & Release

on:
  push:
    tags:
      - 'v*.*.*' # Executa ao fazer push de tags no formato v1.0.0, v2.1.3, etc.
  workflow_dispatch: # Permite disparar o build manualmente na aba Actions do GitHub

jobs:
  # ------------------------------------------------------
  # 1. Builds para Android, Web e Linux (Runner Ubuntu)
  # ------------------------------------------------------
  build-ubuntu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [apk, appbundle, web, linux]
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java (necessário para Android)
        if: matrix.target == 'apk' || matrix.target == 'appbundle'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar dependências para Linux
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblldb-dev

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          flutter-version-file: pubspec.yaml # Detecta a versão do Flutter do seu projeto

      - name: Instalar dependências do Flutter
        run: flutter pub get

      - name: Compilar artefato (${{ matrix.target }})
        run: |
          if [ "${{ matrix.target }}" = "apk" ]; then
            flutter build apk --release
          elif [ "${{ matrix.target }}" = "appbundle" ]; then
            flutter build appbundle --release
          elif [ "${{ matrix.target }}" = "web" ]; then
            flutter build web --release
            cd build/web && zip -r ../../web-build.zip . && cd ../..
          elif [ "${{ matrix.target }}" = "linux" ]; then
            flutter build linux --release
            cd build/linux/x64/release/bundle && zip -r ../../../../../linux-build.zip . && cd ../../../../..
          fi

      - name: Upload do Artefato
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
            web-build.zip
            linux-build.zip

  # ------------------------------------------------------
  # 2. Build para Windows (Runner Windows)
  # ------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          flutter-version-file: pubspec.yaml

      - name: Instalar dependências
        run: flutter pub get

      - name: Build para Windows
        run: flutter build windows --release

      - name: Compactar build do Windows
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath windows-build.zip

      - name: Upload do Artefato
        uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: windows-build.zip

  # ------------------------------------------------------
  # 3. Builds para iOS e macOS (Runner macOS)
  # ------------------------------------------------------
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [ios, macos]
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          flutter-version-file: pubspec.yaml

      - name: Instalar dependências
        run: flutter pub get

      - name: Build para iOS (Sem assinatura de código)
        if: matrix.target == 'ios'
        run: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos && zip -r ../../../ios-build.zip . && cd ../../..

      - name: Build para macOS
        if: matrix.target == 'macos'
        run: |
          flutter build macos --release
          cd build/macos/Build/Products/Release && zip -r ../../../../../macos-build.zip . && cd ../../../../..

      - name: Upload do Artefato
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: |
            ios-build.zip
            macos-build.zip

  # ------------------------------------------------------
  # 4. Publicação unificada no GitHub Releases
  # ------------------------------------------------------
  publish-release:
    needs: [build-ubuntu, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar todos os artefatos compilados
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Organizar arquivos para a Release
        run: |
          mkdir -p release_assets
          cp artifacts/build-apk/app-release.apk release_assets/app-release.apk || true
          cp artifacts/build-appbundle/app-release.aab release_assets/app-release.aab || true
          cp artifacts/build-web/web-build.zip release_assets/web-build.zip || true
          cp artifacts/build-linux/linux-build.zip release_assets/linux-build.zip || true
          cp artifacts/build-windows/windows-build.zip release_assets/windows-build.zip || true
          cp artifacts/build-ios/ios-build.zip release_assets/ios-build.zip || true
          cp artifacts/build-macos/macos-build.zip release_assets/macos-build.zip || true

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
